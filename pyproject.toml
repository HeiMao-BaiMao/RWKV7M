[project]
name = "rwkv7m"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.12.7,<0.13",
    "jax>=0.10.0,<0.11",
    "numpy>=2.2,<2.4",
    "optax>=0.2.4,<0.3",
    "safetensors>=0.7.0",
    "zipp>=3.20,<4.1",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.10.0,<0.11"]
cuda13 = ["jax[cuda13]>=0.10.0,<0.11"]
rocm = ["jax[rocm7-local]>=0.10.0,<0.11"]
tpu = ["jax[tpu]>=0.10.0,<0.11"]

[project.scripts]
rwkv7m-train-binidx = "rwkv7m.cli.train_binidx:main"
rwkv7m-make-binidx = "rwkv7m.cli.make_binidx:main"
rwkv7m-bench-binidx = "rwkv7m.cli.bench_binidx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwkv7m"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]
